name: Keep Render App Awake

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping /health
        run: |
          curl -sf -o /dev/null -w "health -> %{http_code}\n" \
            https://fraudlens-ixor.onrender.com/health || echo "health ping failed"

      - name: Wait 30s
        run: sleep 30

      - name: Ping /
        run: |
          curl -sf -o /dev/null -w "root -> %{http_code}\n" \
            https://fraudlens-ixor.onrender.com/ || echo "root ping failed"
